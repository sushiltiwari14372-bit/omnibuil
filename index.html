<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniBuild | Premium Web Solutions</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-charcoal: #0a0a0a;
            --electric-blue: #007bff;
            --white: #ffffff;
            --glass: rgba(18, 18, 18, 0.6);
        }
        html { scroll-behavior: smooth; }
        body { background-color: var(--deep-charcoal); color: var(--white); font-family: 'Inter', sans-serif; margin: 0; }
        
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        
        /* Hero */
        .hero { height: 90vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .glass-card { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid rgba(0, 123, 255, 0.2); padding: 50px; border-radius: 20px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.8); }
        
        /* Services Section */
        .services { padding: 100px 0; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 40px; }
        .service-card { background: rgba(255,255,255,0.05); padding: 30px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .service-card:hover { border-color: var(--electric-blue); transform: translateY(-10px); }

        /* Form */
        .contact { padding: 100px 0; background: #0f0f0f; }
        input, textarea { width: 100%; padding: 15px; margin-bottom: 20px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 8px; }
        
        .btn { background: var(--electric-blue); color: white; padding: 15px 40px; border-radius: 8px; text-decoration: none; font-weight: bold; border: none; cursor: pointer; display: inline-block; }
    </style>
</head>
<body>

    <section class="hero">
        <div class="glass-card">
            <h1 style="font-size: 3.5rem;">OmniBuild</h1>
            <p style="color: #aaa; margin-bottom: 30px;">Premium Web Dev for Local Businesses.</p>
            <a href="#contact" class="btn">Get Started</a>
        </div>
    </section>

    <section class="services container">
        <h2 style="text-align: center;">Our Services</h2>
        <div class="grid">
            <div class="service-card"><h3>Web Design</h3><p>Modern, fast, and responsive.</p></div>
            <div class="service-card"><h3>SEO</h3><p>Rank #1 on Google in AP.</p></div>
            <div class="service-card"><h3>Branding</h3><p>Logos that build trust.</p></div>
        </div>
    </section>

    <section id="contact" class="contact">
        <div class="container" style="max-width: 600px;">
            <h2 style="text-align: center;">Start Your Project</h2>
            <form action="https://formspree.io/f/YOUR_ID_HERE" method="POST">
                <input type="text" name="name" placeholder="Business Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <textarea name="message" placeholder="What do you need?" rows="5"></textarea>
                <button type="submit" class="btn" style="width: 100%;">Send Message</button>
            </form>
        </div>
    </section>

</body>
</html>
