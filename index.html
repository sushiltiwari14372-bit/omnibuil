<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNIBUILD | CLICK TO START</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --neon-blue: #00f2ff;
            --neon-pink: #ff007a;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { background: var(--bg); color: white; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; padding-top: 80px; }

        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

        /* Navigation */
        nav { position: fixed; top: 0; width: 100%; height: 80px; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #111; z-index: 1000; display: flex; align-items: center; }
        .nav-content { width: 100%; max-width: 1100px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; }
        .logo { font-weight: 800; font-size: 1.5rem; }
        .logo span { color: var(--neon-blue); }

        /* Hero */
        .hero { height: 60vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .hero h1 { font-size: 4rem; font-weight: 800; margin-bottom: 10px; }
        
        /* THE CLICKABLE BUTTONS */
        .button-row { display: flex; gap: 15px; margin-top: 30px; flex-wrap: wrap; justify-content: center; }
        
        .click-btn { 
            background: #111; color: white; padding: 15px 30px; border-radius: 12px; 
            border: 1px solid #333; cursor: pointer; transition: 0.3s; font-weight: bold;
            display: flex; align-items: center; gap: 10px;
        }
        .click-btn:hover { 
            background: var(--neon-blue); color: #000; transform: translateY(-5px);
            box-shadow: 0 0 20px var(--neon-blue);
        }
        .click-btn:active { transform: scale(0.95); }

        /* Product Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; padding: 60px 0; }
        .card { 
            background: var(--glass); padding: 40px; border-radius: 25px; 
            border: 1px solid rgba(255,255,255,0.05); transition: 0.4s;
        }
        .card:hover { border-color: var(--neon-pink); background: rgba(255, 0, 122, 0.05); }

        /* CONTACT FORM */
        .contact { padding: 80px 0; background: #050505; border-radius: 40px; margin-bottom: 50px; border: 1px solid #111; }
        input, textarea { width: 100%; padding: 20px; background: #000; border: 1px solid #222; color: white; border-radius: 12px; margin-bottom: 15px; }
        
        .main-btn { 
            width: 100%; background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink));
            color: white; padding: 20px; border-radius: 12px; border: none; font-weight: 800;
            font-size: 1.2rem; cursor: pointer; transition: 0.3s;
        }
        .main-btn:hover { box-shadow: 0 0 40px rgba(0, 242, 255, 0.5); transform: scale(1.02); }

    </style>
</head>
<body>

    <nav>
        <div class="nav-content">
            <div class="logo">OMNI<span>BUILD</span></div>
            <div style="color: #27c93f; font-size: 0.8rem;">● SYSTEMS ACTIVE</div>
        </div>
    </nav>

    <div class="container">
        <section class="hero">
            <h1>What do you need?</h1>
            <p style="color: #666;">Click a button to select your service.</p>
            
            <div class="button-row">
                <button class="click-btn" onclick="document.getElementById('msg').value='I need an Instagram Bot. Please send price.'">📸 Instagram Bot</button>
                <button class="click-btn" onclick="document.getElementById('msg').value='I need a Custom Trading Bot. Send more info.'">📈 Trading Bot</button>
                <button class="click-btn" onclick="document.getElementById('msg').value='I need a Web Scraper. How much is the price?'">🔍 Web Scraper</button>
                <button class="click-btn" onclick="document.getElementById('msg').value='I want to talk about a custom AI idea.'">⚡ Custom AI</button>
            </div>
        </section>

        <section class="grid">
            <div class="card">
                <h3>Vibhor Tiwari</h3>
                <p>Lead Developer at OmniBuild. I build the scripts that run your business.</p>
            </div>
            <div class="card">
                <h3>Fast Delivery</h3>
                <p>Most bots are ready in 48-72 hours. No waiting for weeks.</p>
            </div>
        </section>

        <section id="contact" class="contact">
            <div style="max-width: 600px; margin: 0 auto; padding: 0 20px;">
                <h2 style="margin-bottom: 20px; text-align: center;">Send Message</h2>
                <form action="https://formspree.io/f/YOUR_ID" method="POST">
                    <input type="text" name="name" placeholder="Your Name" required>
                    <input type="email" name="email" placeholder="Your Email" required>
                    <textarea id="msg" name="message" placeholder="How can we help you? Click the buttons above to auto-fill this!" rows="5" required></textarea>
                    <button type="submit" class="main-btn">CHECK PRICE & AVAILABILITY →</button>
                </form>
            </div>
        </section>
    </div>

</body>
</html>
