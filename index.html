<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniBuild | Premium Web Solutions</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-charcoal: #0a0a0a;
            --electric-blue: #007bff;
            --white: #ffffff;
            --glass: rgba(18, 18, 18, 0.4);
        }
        body {
            background-color: var(--deep-charcoal);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }
        header {
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 123, 255, 0.2);
        }
        .hero {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        h1 {
            font-size: 4rem;
            text-shadow: 0 0 20px rgba(0, 123, 255, 0.5);
            margin-bottom: 10px;
        }
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 123, 255, 0.3);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            max-width: 800px;
        }
        .btn {
            background: var(--electric-blue);
            color: white;
            padding: 15px 30px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 123, 255, 0.6);
            transition: 0.3s;
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(0, 123, 255, 0.9); }
    </style>
</head>
<body>
    <header>
        <div style="font-size: 1.5rem; font-weight: bold; color: var(--electric-blue);">OmniBuild</div>
    </header>
    <section class="hero">
        <div class="glass-card">
            <h1>Elevate Your Business</h1>
            <p style="color: #b0b0b0; font-size: 1.2rem; margin-bottom: 30px;">Premium Web Development & Digital Branding for local legends.</p>
            <a href="#contact" class="btn">Start Your Project</a>
        </div>
    </section>
</body>
</html>
