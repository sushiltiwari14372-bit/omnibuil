<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNIBUILD | WEBSITES & AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --blue: #00f2ff;
            --pink: #ff007a;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { background: var(--bg); color: white; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; padding-top: 80px; }

        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

        /* Navigation */
        nav { position: fixed; top: 0; width: 100%; height: 80px; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #111; z-index: 1000; display: flex; align-items: center; }
        .nav-content { width: 100%; max-width: 1100px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; }
        .logo { font-weight: 800; font-size: 1.5rem; }
        .logo span { color: var(--blue); }

        /* Hero */
        .hero { height: 60vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .hero h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 800; margin-bottom: 15px; background: linear-gradient(to right, #fff, var(--blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* SERVICE GRID */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; padding: 50px 0; }
        .card { background: var(--glass); padding: 40px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .card:hover { border-color: var(--blue); transform: translateY(-5px); }
        .card h3 { color: var(--blue); margin-bottom: 10px; font-size: 1.5rem; }
        .card p { color: #888; font-size: 0.95rem; line-height: 1.5; }

        /* BUTTONS */
        .button-row { display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; justify-content: center; }
        .click-btn { 
            background: #111; color: white; padding: 12px 20px; border-radius: 10px; 
            border: 1px solid #333; cursor: pointer; transition: 0.3s; font-weight: bold; font-size: 0.9rem;
        }
        .click-btn:hover { background: var(--blue); color: #000; }

        /* CONTACT FORM */
        .contact { padding: 80px 0; border-top: 1px solid #111; }
        input, textarea { width: 100%; padding: 20px; background: #0a0a0a; border: 1px solid #222; color: white; border-radius: 12px; margin-bottom: 15px; font-family: inherit;
