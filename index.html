<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniBuild - Thank You!</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS Reset & Variables */
        :root {
            --charcoal: #121212;
            --deep-charcoal: #0a0a0a;
            --electric-blue: #007bff;
            --electric-blue-light: #009bff;
            --white: #ffffff;
            --light-gray: #b0b0b0;

            /* RGB versions for rgba transparency */
            --charcoal-rgb: 18, 18, 18;
            --electric-blue-rgb: 0, 123, 255;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--deep-charcoal);
            color: var(--white);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            color: var(--electric-blue);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        a:hover {
            color: var(--electric-blue-light);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header/Navigation */
        header {
            padding: 20px 0;
            background-color: rgba(var(--charcoal-rgb), 0.6);
            backdrop-filter: blur(5px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(var(--electric-blue-rgb), 0.1);
            text-align: center;
        }

        header .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--white);
            letter-spacing: 1px;
            display: inline-block;
            text-shadow: 0 0 8px rgba(var(--electric-blue-rgb), 0.6);
        }

        /* Button Styling */
        .btn {
            display: inline-block;
            padding: 15px 40px;
            background-color: var(--electric-blue);
            color: var(--white);
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 0 15px rgba(var(--electric-blue-rgb), 0.6);
        }

        .btn:hover {
            background-color: var(--electric-blue-light);
            box-shadow: 0 0 25px rgba(var(--electric-blue-rgb), 0.8);
            transform: translateY(-3px);
        }

        /* Glassmorphism Cards (Reused) */
        .glassmorphism-card {
            background: rgba(var(--charcoal-rgb), 0.4);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(var(--electric-blue-rgb), 0.2);
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            padding: 30px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Thank You Section */
        #thank-you-hero {
            position: relative;
            flex-grow: 1; /* Allows it to take up remaining space */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            padding: 40px 20px; /* Added padding to ensure content isn't flush */
        }

        /* Subtle radial gradient background glow for hero */
        #thank-you-hero::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(var(--electric-blue-rgb), 0.1) 0%, rgba(var(--charcoal-rgb), 0) 70%);
            transform: translate(-50%, -50%);
            border-radius: 50%;
            z-index: 0;
            animation: heroGlow 15s infinite alternate ease-in-out;
        }

        @keyframes heroGlow {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        .thank-you-card {
            max-width: 600px;
            margin: auto; /* Center the card horizontally if it's not the hero container directly */
            padding: 50px;
            position: relative;
            z-index: 1; /* Bring card above background glow */
        }

        .checkmark-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            border-radius: 50%;
            background-color: var(--electric-blue);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(var(--electric-blue-rgb), 0.8);
            animation: pulseGlow 2s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); box-shadow: 0 0 25px rgba(var(--electric-blue-rgb), 0.8), 0 0 10px rgba(var(--electric-blue-rgb), 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(var(--electric-blue-rgb), 1), 0 0 15px rgba(var(--electric-blue-rgb), 0.6); }
            100% { transform: scale(1); box-shadow: 0 0 25px rgba(var(--electric-blue-rgb), 0.8), 0 0 10px rgba(var(--electric-blue-rgb), 0.4); }
        }

        .checkmark-container svg {
            width: 60px;
            height: 60px;
            stroke: var(--white);
            stroke-width: 4;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawCheckmark 1s forwards cubic-bezier(0.65, 0, 0.45, 1);
        }

        @keyframes drawCheckmark {
            to { stroke-dashoffset: 0; }
        }

        .thank-you-card h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--white);
            text-shadow: 0 0 15px rgba(var(--electric-blue-rgb), 0.7);
        }

        .thank-you-card p {
            font-size: 1.3rem;
            color: var(--light-gray);
            margin-bottom: 40px;
        }

        /* Footer */
        footer {
            margin-top: auto;
            background-color: var(--deep-charcoal);
            padding: 40px 0;
            text-align: center;
            border-top: 1px solid rgba(var(--electric-blue-rgb), 0.1);
            color: var(--light-gray);
            font-size: 0.9rem;
        }

        footer p {
            margin-bottom: 10px;
        }

        .footer-links a {
            margin: 0 15px;
            color: var(--electric-blue);
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: var(--electric-blue-light);
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .thank-you-card {
                padding: 40px;
            }
            .thank-you-card h1 {
                font-size: 3rem;
            }
            .thank-you-card p {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 768px) {
            header .logo {
                font-size: 1.5rem;
            }
            .thank-you-card {
                max-width: 90%;
                padding: 30px;
            }
            .checkmark-container {
                width: 80px;
                height: 80px;
                margin-bottom: 25px;
            }
            .checkmark-container svg {
                width: 50px;
                height: 50px;
            }
            .thank-you-card h1 {
                font-size: 2.5rem;
            }
            .thank-you-card p {
                font-size: 1rem;
            }
            .btn {
                padding: 12px 30px;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 15px 0;
            }
            .thank-you-card {
                padding: 25px;
            }
            .thank-you-card h1 {
                font-size: 2rem;
            }
            .thank-you-card p {
                font-size: 0.9rem;
            }
            .btn {
                padding: 10px 25px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="index.html" class="logo">OmniBuild</a>
        </div>
    </header>

    <main>
        <section id="thank-you-hero">
            <div class="container">
                <div class="thank-you-card glassmorphism-card">
                    <div class="checkmark-container">
                        <svg viewBox="0 0 100 100">
                            <path d="M20,50 L45,75 L80,30" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <h1>Thank You!</h1>
                    <p>Our team will contact you within 24 hours to discuss your project.</p>
                    <a href="index.html" class="btn">Go Back to Home</a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2023 OmniBuild. All rights reserved.</p>
            <div class="footer-links">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
            </div>
        </div>
    </footer>
</body>
</html>
